<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Universal Dealer Services — One-pager</title>
<!--
  One-page, letter-size leave-behind. Open with ?lang=en or ?lang=es.
  Build both PDFs with:  node scripts/build-leave-behind.mjs
  Keep it short: one idea, three benefits, three steps, the terms, contact.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  @page { size: 8.5in 11in; margin: 0; }
  :root { --navy-950:#0A1426; --navy-900:#0E1B33; --paper:#F5F8FC; --ink:#122038; --cyan:#19B8E8; --cyan-deep:#0E8FB8; --amber:#E8A33D; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Barlow', sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .display { font-family: 'Barlow Semi Condensed', sans-serif; }
  .page { width: 8.5in; height: 11in; overflow: hidden; display: flex; flex-direction: column; }

  .band { background: var(--navy-900); color: #fff; display: grid; grid-template-columns: 1fr 2.4in; gap: 0.35in; align-items: center; padding: 0.42in 0.6in 0.4in; }
  .brand { font-size: 10pt; color: rgba(245,248,252,.7); letter-spacing: .02em; }
  .brand b { color: #fff; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 13pt; margin-right: 6px; }
  h1 { margin-top: 0.16in; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 32pt; line-height: 1.02; }
  .sub { margin-top: 0.12in; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 19pt; color: var(--amber); line-height: 1.15; }
  .lede { margin-top: 0.14in; font-size: 12pt; line-height: 1.45; color: rgba(245,248,252,.85); }
  html[lang="es"] h1 { font-size: 29pt; }
  .body > div + div { margin-top: 0.16in; }
  .photo img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 4px; display: block; }

  .body { flex: 1; padding: 0.36in 0.6in 0.28in; display: flex; flex-direction: column; justify-content: space-between; }
  .label { font-size: 9.5pt; font-weight: 600; color: var(--cyan-deep); text-transform: uppercase; letter-spacing: .1em; }
  .benefits { margin-top: 0.12in; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.3in; }
  .benefit svg { width: 34px; height: 34px; color: var(--cyan-deep); }
  .benefit h2 { margin-top: 8px; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 16pt; line-height: 1.1; }
  .benefit p { margin-top: 6px; font-size: 11.5pt; line-height: 1.42; color: rgba(18,32,56,.8); }

  .steps { margin-top: 0.12in; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.2in; }
  .step { background: var(--paper); border-radius: 4px; padding: 12px 14px; display: flex; gap: 10px; align-items: baseline; }
  .step b { font-family: 'Barlow Semi Condensed', sans-serif; font-size: 22pt; color: var(--cyan-deep); line-height: 1; }
  .step span { font-size: 11.5pt; line-height: 1.3; font-weight: 500; }

  .terms { margin-top: 0.12in; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 0.3in; }
  .terms div { font-size: 12pt; display: flex; gap: 8px; align-items: center; font-weight: 500; }
  .terms svg { width: 18px; height: 18px; flex-shrink: 0; color: #16a34a; }

  .cta { background: var(--navy-950); color: #fff; display: grid; grid-template-columns: 1fr auto; gap: 0.3in; align-items: center; padding: 0.24in 0.6in 0.2in; }
  .cta h2 { font-family: 'Barlow Semi Condensed', sans-serif; font-size: 21pt; line-height: 1.05; }
  .contact { margin-top: 10px; font-size: 12.5pt; line-height: 1.6; }
  .contact span { color: var(--cyan); font-weight: 600; display: inline-block; width: 0.8in; }
  .rep { margin-top: 10px; display: flex; gap: 8px; align-items: end; font-size: 10pt; color: rgba(245,248,252,.7); }
  .rep i { flex: 1; border-bottom: 1px solid rgba(245,248,252,.45); height: 14px; max-width: 3.4in; }
  .qr { background: #fff; padding: 8px; border-radius: 4px; width: 1.25in; text-align: center; }
  .qr img { width: 100%; display: block; }
  .qr span { display: block; margin-top: 4px; font-size: 8pt; color: var(--ink); line-height: 1.2; }
  .foot { background: var(--navy-950); color: rgba(245,248,252,.5); font-size: 8pt; padding: 0 0.6in 0.2in; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const ICON = {
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',
  wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h15a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H3z"/><path d="M3 7l12-4v4"/><circle cx="16" cy="13.5" r="1.4"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h11v8H8l-4 3z"/><path d="M15 9h5v8l-3-2h-6v-2"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
};

const COPY = {
  en: {
    brand: 'A Universal Insurance Brokers program',
    h1: 'An insurance agent inside your dealership.',
    sub: 'Free to your store, and we pay you rent.',
    lede: 'A licensed, bilingual agent at a desk in your store handles the insurance step of every sale.',
    alt: 'An insurance advisor reviewing coverage with customers in a dealership showroom',
    what: 'What your store gets',
    benefits: [
      ['shield', 'Every delivery verified', 'We check each customer’s coverage with the carrier before the keys move. No insurance? We write a policy on the spot.'],
      ['wallet', 'More room for F&I', 'We shop each customer’s insurance for free. When their payment goes down, that money can go to the products your F&I office sells.'],
      ['chat', 'English and Spanish', 'Every customer handles the insurance step in their own language, so the deal keeps moving.'],
    ],
    how: 'How we start',
    steps: ['30-minute walkthrough of your store', 'Free review of your last 90 days of deliveries', '60-day pilot at one store'],
    termsLabel: 'The terms',
    terms: ['$0 cost to the dealership', 'Flat monthly rent, paid to you', 'Customers never have to buy from us', 'Licensed Florida insurance agents'],
    cta: 'Book a 30-minute walkthrough.',
    phone: 'Call', email: 'Email', web: 'Web', site: 'universaldealerservices.com',
    rep: 'Your contact:',
    qr: 'Scan to see the full program',
    qrSrc: 'qr-en.svg',
    foot: 'Universal Dealer Services is a program of Universal Insurance Brokers, an independent Florida insurance brokerage (license #L099044) · Hialeah · Doral · Boca Raton · Lehigh Acres',
  },
  es: {
    brand: 'Un programa de Universal Insurance Brokers',
    h1: 'Un agente de seguros dentro de su concesionario.',
    sub: 'Gratis para usted, y le pagamos renta.',
    lede: 'Un agente licenciado y bilingüe, en un escritorio de su concesionario, se encarga del seguro en cada venta.',
    alt: 'Un asesor de seguros revisando la cobertura con clientes en la sala de exhibición de un concesionario',
    what: 'Lo que recibe su concesionario',
    benefits: [
      ['shield', 'Cada entrega verificada', 'Verificamos con la aseguradora la cobertura de cada cliente antes de la entrega. ¿Sin seguro? Le emitimos una póliza en el momento.'],
      ['wallet', 'Más espacio para F&I', 'Cotizamos gratis el seguro de cada cliente. Cuando baja su pago, ese dinero puede ir a los productos de F&I.'],
      ['chat', 'En español y en inglés', 'Cada cliente resuelve el seguro en su propio idioma, para que la venta siga avanzando.'],
    ],
    how: 'Cómo empezamos',
    steps: ['Visita de 30 minutos a su concesionario', 'Revisión gratis de sus últimos 90 días de entregas', 'Piloto de 60 días en un concesionario'],
    termsLabel: 'Las condiciones',
    terms: ['$0 de costo para el concesionario', 'Renta mensual fija, pagada a usted', 'El cliente no tiene que comprarnos el seguro', 'Agentes de seguros con licencia en Florida'],
    cta: 'Agende una visita de 30 minutos.',
    phone: 'Teléfono', email: 'Correo', web: 'Web', site: 'universaldealerservices.com/es',
    rep: 'Su contacto:',
    qr: 'Escanee para ver el programa completo',
    qrSrc: 'qr-es.svg',
    foot: 'Universal Dealer Services es un programa de Universal Insurance Brokers, correduría de seguros independiente en Florida (licencia #L099044) · Hialeah · Doral · Boca Raton · Lehigh Acres',
  },
};

const lang = new URLSearchParams(location.search).get('lang') === 'es' ? 'es' : 'en';
const t = COPY[lang];
document.documentElement.lang = lang;
document.getElementById('root').innerHTML = `
<section class="page">
  <header class="band">
    <div>
      <p class="brand"><b>Universal Dealer Services</b></p>
      <h1>${t.h1}</h1>
      <p class="sub">${t.sub}</p>
      <p class="lede">${t.lede}</p>
    </div>
    <div class="photo"><img src="../public/hero-sm.jpg" alt="${t.alt}"></div>
  </header>
  <div class="body">
    <div>
      <p class="label">${t.what}</p>
      <div class="benefits">
        ${t.benefits.map(([i, h, p]) => `<div class="benefit">${ICON[i]}<h2>${h}</h2><p>${p}</p></div>`).join('')}
      </div>
    </div>
    <div>
      <p class="label">${t.how}</p>
      <div class="steps">${t.steps.map((s, i) => `<div class="step"><b>${i + 1}</b><span>${s}</span></div>`).join('')}</div>
    </div>
    <div>
      <p class="label">${t.termsLabel}</p>
      <div class="terms">${t.terms.map((s) => `<div>${ICON.check}${s}</div>`).join('')}</div>
    </div>
  </div>
  <footer>
    <div class="cta">
      <div>
        <h2>${t.cta}</h2>
        <p class="contact"><span>${t.phone}</span>(239) 204-2208<br><span>${t.email}</span>quotes@universalinsurancebroker.com<br><span>${t.web}</span>${t.site}</p>
        <div class="rep">${t.rep}<i></i></div>
      </div>
      <div class="qr"><img src="${t.qrSrc}" alt=""><span>${t.qr}</span></div>
    </div>
    <p class="foot">${t.foot}</p>
  </footer>
</section>`;
</script>
</body>
</html>
