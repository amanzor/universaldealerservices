<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Universal Dealer Services — Dealer leave-behind</title>
<!--
  Two-sided, letter-size leave-behind: page 1 English, page 2 Spanish.
  Build the PDF with:  node scripts/build-leave-behind.mjs
  Copy is condensed from app/content.js. Keep claims and sources in step with the site.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: 8.5in 11in; margin: 0; }
  :root {
    --navy-950: #0A1426; --navy-900: #0E1B33; --navy-800: #16263F; --navy-700: #1F3252;
    --paper: #F5F8FC; --ink: #122038; --cyan: #19B8E8; --cyan-deep: #0E8FB8; --amber: #E8A33D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body { font-family: 'Barlow', sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .display { font-family: 'Barlow Semi Condensed', sans-serif; }

  .page {
    width: 8.5in; height: 11in; overflow: hidden; position: relative;
    display: flex; flex-direction: column; page-break-after: always; break-after: page;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }

  /* Top band */
  .band { background: var(--navy-900); color: var(--paper); display: grid; grid-template-columns: 1fr 2.3in; gap: 0.28in; padding: 0.34in 0.45in 0.3in; }
  .brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 0.13in; }
  .brand b { font-family: 'Barlow Semi Condensed', sans-serif; font-size: 15pt; color: #fff; letter-spacing: -0.01em; }
  .brand span { font-size: 8pt; color: rgba(245,248,252,.65); }
  h1 { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; color: #fff; font-size: 23pt; line-height: 1.02; letter-spacing: -0.01em; }
  .lede { margin-top: 0.1in; font-size: 9.6pt; line-height: 1.38; color: rgba(245,248,252,.85); }
  .lede strong { color: var(--amber); font-weight: 600; }
  .photo { position: relative; align-self: center; }
  .photo img { width: 100%; aspect-ratio: 3 / 2.15; object-fit: cover; border-radius: 3px; display: block; }
  .photo .tag { position: absolute; left: 8px; right: 8px; bottom: -10px; background: #fff; color: var(--ink); padding: 4px 7px; border-radius: 2px; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  .photo .tag b { display: block; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 7.8pt; line-height: 1.2; }
  .photo .tag span { display: block; font-size: 6.6pt; color: rgba(18,32,56,.65); }

  .body { padding: 0.22in 0.45in 0.2in; flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 0.15in; }
  /* English copy is shorter than Spanish: set it a touch larger so both sides fill the sheet. */
  .page[lang="en"] .body { zoom: 1.08; }
  .eyebrow { font-size: 8pt; font-weight: 600; color: var(--cyan-deep); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }

  /* Three programs */
  .programs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.2in; }
  .program { border-top: 2.5px solid var(--cyan-deep); padding-top: 7px; }
  .program h2 { font-family: 'Barlow Semi Condensed', sans-serif; font-size: 11.5pt; font-weight: 700; line-height: 1.1; }
  .program p { margin-top: 3px; font-size: 8.4pt; line-height: 1.36; color: rgba(18,32,56,.8); }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--paper); border-radius: 3px; }
  .stat { padding: 7px 10px 8px; border-left: 1px solid rgba(18,32,56,.1); }
  .stat:first-child { border-left: 0; }
  .stat .v { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 17pt; color: var(--cyan-deep); line-height: 1; }
  .stat .l { margin-top: 3px; font-size: 7.7pt; line-height: 1.3; color: rgba(18,32,56,.82); }
  .stat .n { margin-top: 3px; font-size: 6.8pt; color: rgba(18,32,56,.5); }

  /* Lower two columns */
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0.26in; }
  .ledger { background: var(--navy-900); color: var(--paper); border-radius: 3px; padding: 8px 12px 9px; }
  .ledger h3, .pilot h3, .arrangement h3 { font-family: 'Barlow Semi Condensed', sans-serif; font-size: 11pt; font-weight: 700; }
  .ledger h3 { color: #fff; }
  .row { display: flex; justify-content: space-between; gap: 10px; font-size: 8.2pt; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.12); }
  .row:last-of-type { border-bottom: 0; }
  .row b { font-family: 'Barlow Semi Condensed', sans-serif; color: #fff; white-space: nowrap; }
  .row b.rent { color: var(--amber); font-size: 10pt; }
  .ledger .note { margin-top: 4px; font-size: 7.6pt; color: rgba(245,248,252,.65); }
  .arrangement { margin-top: 8px; }
  .arrangement ul, .risk ul { list-style: none; margin-top: 4px; }
  .arrangement li { position: relative; padding-left: 11px; font-size: 8pt; line-height: 1.34; color: rgba(18,32,56,.82); margin-top: 2px; }
  .arrangement li::before { content: ""; position: absolute; left: 0; top: 0.5em; width: 5px; height: 5px; border-radius: 50%; background: var(--cyan-deep); }

  .pilot ol { list-style: none; margin-top: 5px; counter-reset: step; }
  .pilot li { display: grid; grid-template-columns: 16px 1fr; gap: 5px; margin-top: 4px; }
  .pilot li::before { counter-increment: step; content: counter(step); font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; font-size: 13pt; line-height: 1; color: var(--cyan-deep); }
  .pilot li b { font-family: 'Barlow Semi Condensed', sans-serif; font-size: 9pt; }
  .pilot li div { font-size: 8pt; line-height: 1.34; color: rgba(18,32,56,.8); }
  .risk { margin-top: 8px; border-left: 2.5px solid var(--amber); padding: 1px 0 1px 9px; font-size: 7.8pt; line-height: 1.34; color: rgba(18,32,56,.82); }
  .risk b { font-family: 'Barlow Semi Condensed', sans-serif; font-size: 9pt; color: var(--ink); display: block; }

  /* CTA band */
  .cta { margin-top: auto; background: var(--navy-950); color: var(--paper); display: grid; grid-template-columns: 1fr auto; gap: 0.25in; align-items: center; padding: 0.16in 0.45in 0.14in; }
  .cta h2 { font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 700; color: #fff; font-size: 15pt; line-height: 1.05; }
  .cta .sub { margin-top: 3px; font-size: 8.6pt; color: rgba(245,248,252,.75); }
  .contact { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 9.6pt; font-weight: 600; color: #fff; }
  .contact span { color: var(--cyan); font-weight: 500; margin-right: 4px; }
  .rep { margin-top: 8px; display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 6px; align-items: end; font-size: 8pt; color: rgba(245,248,252,.7); }
  .rep i { display: block; border-bottom: 1px solid rgba(245,248,252,.45); height: 14px; }
  .qr { background: #fff; padding: 6px; border-radius: 3px; text-align: center; width: 1.02in; }
  .qr img { width: 100%; display: block; }
  .qr span { display: block; margin-top: 4px; font-size: 6.6pt; color: var(--ink); line-height: 1.2; }

  .foot { padding: 0.07in 0.45in 0.13in; background: var(--navy-950); color: rgba(245,248,252,.5); font-size: 6.4pt; line-height: 1.4; border-top: 1px solid rgba(255,255,255,.08); }
</style>
</head>
<body>
<div id="root"></div>

function page(t) {

        </div>
        <div>

            <h3>${t.pilotTitle}</h3>

          </div>
          <div class="risk"><b>${t.riskTitle}</b>${t.risk}</div>
        </div>
      </div>
    </div>

    <footer>
      <div class="cta">
        <div>
          <h2>${t.ctaTitle}</h2>

          <div class="contact">
